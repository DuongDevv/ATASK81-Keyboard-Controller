name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Native Binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: keyboard-setting-core-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact-name: keyboard-setting-core-windows-x86_64.exe
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native Binary
        working-directory: ./src-tauri
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact (Linux)
        if: runner.os == 'Linux'
        run: cp src-tauri/target/${{ matrix.target }}/release/keyboard-setting-core ${{ matrix.artifact-name }}

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        run: cp src-tauri/target/${{ matrix.target }}/release/keyboard-setting-core.exe ${{ matrix.artifact-name }}

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
